name: Checks
on: [push, pull_request]
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for script in install.sh install-browser.sh install-editor.sh bin/desktop lib/*.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Installer choices
        run: bash tests/installer.sh && bash tests/management.sh
      - name: Python syntax
        run: python3 -m py_compile tests/check_vnc.py
